# ============================================================
#  cookie-strip：去掉 storyden 会话 Cookie 的 Secure 标志
#  仅「纯 HTTP 部署」需要（无域名、无 HTTPS 时）：
#  Storyden 1.26 无条件给会话 Cookie 加 Secure，浏览器在 HTTP 下
#  会拒绝保存 → 登录后立刻变回未登录。这里用 Nginx 精准去掉 Secure。
#
#  ⚠️ 这个容器同时是 /api/* 的必经之路，所以它的请求体上限直接决定
#     文件能不能传上去。Nginx 默认 client_max_body_size 只有 1MB，
#     超过就由 Nginx 直接返回 413（前端只会看到「上传失败」），
#     所以下面必须显式放开到 StoryDen 自己的上限（50MB）。
#
#  ⚠️ 以后上了 HTTPS/域名，必须删除 cookie-strip 服务并恢复
#     Caddyfile 里 storyden:8000 直连（Secure 在 HTTPS 下是必须的）！
# ============================================================
server {
    listen 8000;

    # 允许上传文档 / 图片 / 视频：Nginx 默认 1MB，会拦掉 9MB 的 PDF 这类文件。
    # 取值与 StoryDen 内部的请求体上限一致（MaxRequestSizeBytes = 50MB），
    # 超过 50MB 的请求由后端返回明确错误，而不是在代理层被静默截断。
    client_max_body_size 50m;
    # 大文件上传时放宽超时，避免传到一半被 Nginx 断开
    client_body_timeout 300s;
    # 提高内存缓冲，减少大文件落盘临时文件的次数（不影响正确性，仅优化）
    client_body_buffer_size 1m;

    location / {
        proxy_pass http://storyden:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        # 关键：移除 Secure 属性（nginx 1.25.1+ 支持 nosecure）
        proxy_cookie_flags storyden-session nosecure;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
